# ---------------------------------------------------------------------------
# Agentic Platform Backend - full cloud-style stack
#
#   api        : HTTP/REST/SSE/WebSocket service
#   worker     : durable background jobs (task execution, extraction, ...)
#   migrate    : one-shot Alembic migration runner
#   postgres   : primary database (production)
#   redis      : coordination + cross-process events (optional but wired)
#   minio      : S3-compatible object storage (profile: storage)
#
# Usage:
#   cp .env.example .env          # then edit values
#   docker compose up -d
#   docker compose logs -f api
#
# Single-node local mode without external services:
#   docker compose --profile local up
# ---------------------------------------------------------------------------
name: agentic-platform

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &shared_env
      AGP_ENVIRONMENT: production
      AGP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agp}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agp}
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_SECRET_KEY: ${AGP_SECRET_KEY:?set AGP_SECRET_KEY in .env}
      AGP_STORAGE_BACKEND: ${AGP_STORAGE_BACKEND:-local}
      AGP_STORAGE_LOCAL_ROOT: /srv/app/data/storage
      AGP_S3_ENDPOINT_URL: ${AGP_S3_ENDPOINT_URL:-}
      AGP_S3_BUCKET: ${AGP_S3_BUCKET:-agentic-platform}
      AGP_S3_ACCESS_KEY_ID: ${AGP_S3_ACCESS_KEY_ID:-}
      AGP_S3_SECRET_ACCESS_KEY: ${AGP_S3_SECRET_ACCESS_KEY:-}
      AGP_SANDBOX_ROOT: /srv/app/data/sandboxes
      AGP_SANDBOX_BACKEND: ${AGP_SANDBOX_BACKEND:-local}
      AGP_SALUKI_ENDPOINT: ${AGP_SALUKI_ENDPOINT:-}
      AGP_SALUKI_API_KEY: ${AGP_SALUKI_API_KEY:-}
      AGP_AUTO_APPROVE_PLANS: ${AGP_AUTO_APPROVE_PLANS:-false}
      AGP_BOOTSTRAP_ADMIN_EMAIL: ${AGP_BOOTSTRAP_ADMIN_EMAIL:-}
      AGP_BOOTSTRAP_ADMIN_PASSWORD: ${AGP_BOOTSTRAP_ADMIN_PASSWORD:-}
      AGP_CORS_ORIGINS: ${AGP_CORS_ORIGINS:-}
      AGP_LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *shared_env
    ports:
      - "${AGP_API_PORT:-8000}:8000"
    volumes:
      - app-data:/srv/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *shared_env
    command: ["python", "-m", "app.worker"]
    volumes:
      - app-data:/srv/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${AGP_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: 2g

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agp} -d ${POSTGRES_DB:-agp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # never expose the database publicly without additional controls
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional S3-compatible storage (docker compose --profile storage up)
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AGP_S3_ACCESS_KEY_ID:-agp-minio}
      MINIO_ROOT_PASSWORD: ${AGP_S3_SECRET_ACCESS_KEY:?set AGP_S3_SECRET_ACCESS_KEY for minio}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  app-data:
